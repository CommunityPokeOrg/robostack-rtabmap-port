# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-humble-rtabmap
  version: 0.22.1
source:
  git: https://github.com/ros2-gbp/rtabmap-release.git
  tag: release/humble/rtabmap/0.22.1-1
  target_directory: ros-humble-rtabmap/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 18
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://introlab.github.io/rtabmap
  repository: https://github.com/introlab/rtabmap
  license: BSD-3-Clause
  summary: RTAB-Map's standalone library. RTAB-Map is a RGB-D SLAM approach with real-time constraints.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - numpy
    - octomap
    - pcl
    - pip
    - proj
    - python
    - ros-humble-cv-bridge
    - ros-humble-gtsam
    - ros-humble-libg2o
    - ros-humble-qt-gui-cpp
    - ros-humble-ros-environment
    - ros-humble-ros-workspace
    - ros2-distro-mutex 0.8.* humble_*
    - sqlite 3.*
    - vtk-base
    - zlib
  run:
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - octomap
    - pcl
    - python
    - ros-humble-cv-bridge
    - ros-humble-gtsam
    - ros-humble-libg2o
    - ros-humble-qt-gui-cpp
    - ros-humble-ros-workspace
    - ros2-distro-mutex 0.8.* humble_*
    - sqlite
    - vtk-base
    - zlib
